<!doctype html>
<html lang="en">
<head>

<title>golem-p2p telemetry</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --wash: rgba(11,11,11,.04);

  --direct: #2a78d6; --relay: #eb6834; --s3: #1baf7a; --red: #e34948; --violet: #6250d6;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --off: #b4b3ac;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --wash: rgba(255,255,255,.05);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --direct: #3987e5; --relay: #d95926; --s3: #199e70; --red: #e66767; --violet: #9085e9;
    --off: #5f5e59; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --wash: rgba(255,255,255,.05);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --direct: #3987e5; --relay: #d95926; --s3: #199e70; --red: #e66767; --violet: #9085e9;
  --off: #5f5e59; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
a { color: var(--direct); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 14px; font-weight: 600; margin: 0; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--off); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--off); }
.dot.hollow.good { box-shadow: inset 0 0 0 2px var(--good); }
.live .dot.good { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 25%, transparent); } }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  background: color-mix(in srgb, var(--crit) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); }
.banner.on { display: block; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.tile { padding: 12px 14px; min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; white-space: nowrap; }
.tile .val small { font-size: 15px; font-weight: 500; color: var(--ink-2); }

.tile .pair .val { font-size: 20px; }
.seg { display: flex; gap: 2px; height: 8px; margin-top: 8px; }

.key { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; white-space: nowrap; }

.mapcard { position: relative; margin-bottom: 14px; overflow: hidden; }

.legend { display: flex; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); gap: 4px 0; }
.legend svg { vertical-align: middle; }
#map { display: block; width: 100%; height: clamp(380px, 62vh, 640px); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
#map .n { cursor: pointer; }
#map .n .hit { fill: transparent; touch-action: none; }

#map .lk.relay { stroke: var(--relay); stroke-dasharray: 7 5; }

#map .lhit { fill: none; stroke: transparent; stroke-width: 16px; cursor: pointer; stroke-linecap: round; }
#map .glow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#map .sel { fill: none; stroke: var(--ink); stroke-opacity: .16; stroke-linecap: round; stroke-linejoin: round; }

#map .flow { stroke: var(--surface); stroke-width: 1.2px; }
#map .flow.direct { fill: var(--direct); } #map .flow.relay { fill: var(--relay); } #map .flow.unknown { fill: var(--muted); }
#map .nc { stroke: var(--surface); stroke-width: 2px; transition: fill .4s, r .4s; }
#map .nc.online { fill: var(--good); } #map .nc.stale { fill: var(--warn); } #map .nc.offline { fill: var(--off); }
#map .nc.peer { fill: var(--surface); stroke-width: 2.5px; } #map .nc.peer.online { stroke: var(--good); } #map .nc.peer.offline, #map .nc.peer.stale { stroke: var(--off); }
#map .ring { fill: none; stroke: var(--ink); stroke-width: 2px; opacity: 0; transition: opacity .2s; }
#map .n.selected .ring { opacity: .9; }
#map .rshape { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: 1.6px; }
#map .n.selected .rshape { stroke: var(--ink); stroke-width: 2.4px; }
#map .rglyph { fill: none; stroke: var(--ink-2); stroke-width: 1.4px; stroke-linecap: round; pointer-events: none; }
#map .empty { font-size: 14px; fill: var(--muted); stroke: none; text-anchor: middle; }
.mapfoot { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; }
.rangebar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 18px 0 10px; }
.rangebar h2 { margin-right: 8px; }
.charts { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
@media (min-width: 780px) { .charts { grid-template-columns: 1fr 1fr; } }
.chartcard { padding: 12px 14px 8px; min-width: 0; }
.chartcard .legend { margin: 4px 0 2px; min-height: 18px; }
.chart { position: relative; transition: opacity .2s; }
.chart.loading { opacity: .5; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1px; shape-rendering: crispEdges; }
.chart .base { stroke: var(--axis); stroke-width: 1px; shape-rendering: crispEdges; }
.chart .ln { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
.chart .xh { stroke: var(--axis); stroke-width: 1px; }
.chart .nodata { font-size: 12px; fill: var(--muted); text-anchor: middle; }
.tablecard { margin-bottom: 14px; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 900px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; } th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover, tbody tr:focus { background: var(--wash); outline: none; }
tbody tr.dim td { color: var(--muted); }
.nm { display: flex; align-items: center; gap: 8px; } .nm b { font-weight: 600; } .id { color: var(--muted); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.err { color: var(--crit); }
footer { font-size: 12px; color: var(--muted); padding: 6px 0 24px; display: flex; gap: 6px 16px; flex-wrap: wrap; }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  padding: 7px 10px; font-size: 12px; max-width: 280px; display: none; }
#tip .t { color: var(--ink-2); margin-bottom: 3px; } #tip .r { display: flex; align-items: center; gap: 7px; } #tip .r b { font-variant-numeric: tabular-nums; } #tip .r span { color: var(--ink-2); }
#tip .r i { width: 12px; border-top: 2px solid; } #tip .r i.dash { border-top-style: dashed; }

  box-shadow: var(--shadow); transform: translateX(105%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s;
  overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 24px; }
#panel.open { transform: none; visibility: visible; transition: transform .25s ease; }
@media (max-width: 700px) {
  #panel { top: auto; left: 0; width: 100%; height: 74vh; border-left: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; transform: translateY(105%); }
  #map { height: 460px; }
  .mapfoot { display: none; }
  .wrap { padding: 12px; }
}
.ph { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.ph h3 { margin: 0; font-size: 17px; font-weight: 650; word-break: break-word; }
.ph .x { margin-left: auto; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 6px 0; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 10px 0 14px; font-size: 13px; }
dl.kv dt { color: var(--ink-2); } dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.psec { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.plink { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.plink:hover { background: var(--wash); }
.plink .rt { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.linkish { color: var(--direct); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; background: none; border: 0; padding: 0; }
.timeline { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 0; background: var(--surface-2); }
.timeline span { height: 100%; }
.tlaxis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.tot { width: 100%; min-width: 0; font-size: 12.5px; } .tot td { padding: 4px 0; border: 0; } .tot td.num { padding-left: 10px; }
.copy { font-size: 11px; padding: 1px 7px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>golem-p2p telemetry</h1>
    <span class="chip" id="net" title="network">–</span>
    <span class="spacer"></span>
    <span class="live" id="live"><span class="dot"></span><span id="livetxt">connecting…</span></span>
    <button class="btn" id="theme" type="button" title="Toggle light / dark">◐ Theme</button>
  </header>
  <div class="banner" id="banner" role="status"></div>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <section class="card mapcard" aria-label="Network map">
    <div class="cardhead">
      <h2>Live network</h2>
      <div class="legend" id="maplegend"></div>
      <span class="spacer"></span>
      <button class="btn" id="relayout" type="button" title="Forget dragged and saved positions">Reset layout</button>
    </div>
    <svg id="map" role="img" aria-label="Map of nodes, relays and live connections"></svg>
    <div class="mapfoot">drag nodes · click for details</div>
  </section>
  <div class="rangebar" role="group" aria-label="Time range">
    <h2>History</h2>
    <button class="btn" data-range="900" type="button">15m</button>
    <button class="btn" data-range="3600" type="button">1h</button>
    <button class="btn" data-range="21600" type="button">6h</button>
    <button class="btn" data-range="86400" type="button">24h</button>
    <button class="btn" data-range="604800" type="button">7d</button>
    <span class="spacer"></span>
    <span class="live" id="histinfo"></span>
  </div>
  <section class="charts">
    <div class="card chartcard"><h2>Nodes online</h2><div class="legend"></div><div class="chart" id="c-nodes"></div></div>
    <div class="card chartcard"><h2>Links by path</h2><div class="legend"></div><div class="chart" id="c-links"></div></div>
    <div class="card chartcard"><h2>Traffic</h2><div class="legend"></div><div class="chart" id="c-traffic"></div></div>
    <div class="card chartcard"><h2>Failures and path changes</h2><div class="legend"></div><div class="chart" id="c-fail"></div></div>
  </section>
  <section class="card tablecard" aria-label="Nodes">
    <div class="cardhead"><h2>Nodes</h2><span class="legend" id="tablenote"></span></div>
    <div class="tablewrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <footer>
    <span>Nodes report every 5 s; opt out with <code>--no-telemetry</code>; see docs/telemetry.md</span>
    <span class="spacer"></span>
    <a href="v1/state">v1/state</a><a href="v1/nodes">v1/nodes</a><a href="metrics">metrics</a>
  </footer>
</div>
<aside id="panel" aria-label="Details" aria-hidden="true"></aside>
<div id="tip" role="tooltip"></div>
<noscript><p style="padding:16px">This dashboard needs JavaScript. The data is at <a href="v1/state">v1/state</a> and <a href="metrics">metrics</a>.</p></noscript>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const kids = (el, list) => { for (const k of list) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k)); return el; };
function h(tag, attrs, ...c) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;

  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  return kids(el, c);

  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },

  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },

// ---------- formatting ----------
const num = (v) => typeof v === 'number' && isFinite(v);
function fmtNum(v, d = 1) {
  if (!num(v)) return '–';
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + 'G';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';

function fmtBytes(b) {
  if (!num(b)) return '–';
  const u = ['B', 'kB', 'MB', 'GB', 'TB']; let i = 0, v = b;
  while (Math.abs(v) >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return (i === 0 ? Math.round(v) : v.toFixed(v < 10 ? 1 : 0)) + ' ' + u[i];

const fmtRate = (b) => (num(b) ? fmtBytes(b) + '/s' : '–');
const fmtMs = (v) => (num(v) ? (v === 0 ? '0' : v < 10 ? v.toFixed(1) : Math.round(v)) + ' ms' : '–');

  if (sec < 86400) return Math.floor(sec / 3600) + ' h ' + Math.floor((sec % 3600) / 60) + ' min';

const ago = (ms) => (num(ms) ? fmtDur((serverNow() - ms) / 1000) + ' ago' : 'never');

const trunc = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);

const normUrl = (u) => String(u || '').replace(/\/+$/, '');
function relayHost(u) { try { const x = new URL(u); return x.hostname + (x.port ? ':' + x.port : ''); } catch (e) { return String(u || ''); } }

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const STATUS_RANK = { online: 0, stale: 1, offline: 2 };
const statusClass = (s) => (s === 'online' ? 'good' : s === 'stale' ? 'warn' : '');
function statusDot(n) {
  const c = 'dot ' + statusClass(n && n.status) + (n && n.reporting === false ? ' hollow' : '');
  return h('span', { class: c, title: n && n.status || 'unknown' });
}

// ---------- state ----------
const st = {
  state: null, offset: 0, lastOk: 0, range: 3600, hist: null, histOk: 0,
  sel: null, panelHist: null, panelKey: '', sort: { key: 'status', dir: 1 },

const nodeById = (id) => (st.state && st.state.nodes || []).find((n) => n.id === id);
const nodeName = (id) => nodeLabel(nodeById(id) || { id });

// ---------- theme ----------
function applyTheme() {
  const q = new URLSearchParams(location.search).get('theme');
  const t = q === 'dark' || q === 'light' ? q : store.get('gp2p-theme');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
}
function effectiveTheme() {
  return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
applyTheme();
$('#theme').addEventListener('click', () => {
  const t = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store.set('gp2p-theme', t);
});

// ---------- tooltip ----------
const tip = $('#tip');
function showTip(ev, title, rows) {
  tip.replaceChildren();
  if (title) tip.append(h('div', { class: 't' }, title));

    if (typeof r === 'string') tip.append(h('div', null, r));
    else tip.append(h('div', { class: 'r' }, r.color ? h('i', { class: r.dash ? 'dash' : '', style: 'border-color:' + r.color }) : null, h('b', null, r.value), h('span', null, r.label)));
  }
  tip.style.display = 'block';
  const pad = 14, w = tip.offsetWidth, hh = tip.offsetHeight;

        ['Last error', n.last_error ? h('span', { class: 'err' }, String(n.last_error.kind || 'error') + (n.last_error.at ? ' · ' + ago(n.last_error.at) : '')) : 'none'],
      ]));
      const t = n.totals || {};
      const row = (k, v) => h('tr', null, h('td', null, k), h('td', { class: 'num' }, v));
      out.push(h('div', { class: 'psec' }, 'Since start'), h('table', { class: 'tot' }, h('tbody', null,
        row('New connections', fmtNum(t.conns_new)), row('Failed connections', fmtNum(t.conns_failed)), row('Path changes', fmtNum(t.path_changes)),
        row('Requests ok / failed', fmtNum(t.requests_ok) + ' / ' + fmtNum(t.requests_failed)),
        row('Bytes in / out', fmtBytes(t.bytes_in) + ' / ' + fmtBytes(t.bytes_out)), row('Via relays in / out', fmtBytes(t.bytes_in_relay) + ' / ' + fmtBytes(t.bytes_out_relay)))));
    }
    const mine = (S.links || []).filter((l) => l.a === n.id || l.b === n.id);
    out.push(h('div', { class: 'psec' }, 'Links (' + mine.length + ')'));
    if (!mine.length) out.push(h('div', { style: 'color:var(--muted);font-size:13px' }, 'No live connections.'));
    for (const l of mine) {
      const other = l.a === n.id ? l.b : l.a;
      out.push(h('div', { class: 'plink', onclick: () => select({ type: 'link', a: l.a, b: l.b }) },
        h('i', { style: 'width:16px;border-top:2px ' + (l.path === 'relay' ? 'dashed var(--relay)' : l.path === 'direct' ? 'solid var(--direct)' : 'dotted var(--muted)') }),
        nodeName(other), h('span', { class: 'rt' }, pathLabel(l.path) + ' · ' + fmtMs(l.rtt_ms))));
    }
    if (n.reporting !== false) {
      if (hb) {
        out.push(miniChart('Connections, last hour', Object.assign({}, hb, { data: PH.node || [], minMax: 1, series: [{ k: 'direct', label: 'Direct', color: 'var(--direct)' }, { k: 'relay', label: 'Relayed', color: 'var(--relay)', dash: true }] })));
        out.push(miniChart('Traffic, last hour', Object.assign({}, hb, { data: PH.node || [], fmt: rateFmt, series: [{ k: 'rate_in', label: 'In', color: 'var(--direct)' }, { k: 'rate_out', label: 'Out', color: 'var(--s3)' }] })));
      } else out.push(h('div', { class: 'psec' }, 'Loading history…'));
    }
  } else if (sel.type === 'link') {
    const l = (S.links || []).find((x) => linkKey(x.a, x.b) === linkKey(sel.a, sel.b));
    out.push(h('div', { class: 'ph' }, h('h3', null, nodeName(sel.a) + ' ⇄ ' + nodeName(sel.b)), close));
    if (!l) out.push(h('p', { style: 'color:var(--ink-2)' }, 'This link is not live now.'));
    else {
      const by = l.reported_by || [];
      out.push(h('div', null, h('span', { class: 'pill' }, h('i', { style: 'width:14px;border-top:2px ' + (l.path === 'relay' ? 'dashed var(--relay)' : l.path === 'direct' ? 'solid var(--direct)' : 'dotted var(--muted)') }), pathLabel(l.path))));
      out.push(kv([
        ['Ends', h('span', null, nodeBtn(l.a), ' and ', nodeBtn(l.b))], ['Path', pathLabel(l.path) + (l.path === 'relay' && l.relay ? ' via ' + relayHost(l.relay) : '')],
        ['RTT', fmtMs(l.rtt_ms)], ['Traffic', fmtRate(l.rate)], ['On this path', num(l.path_since) ? fmtDur((serverNow() - l.path_since) / 1000) + ' (since ' + clockS(l.path_since) + ')' : '–'],
        ['Path changes', fmtNum(l.path_changes || 0)], ['Reported by', by.length >= 2 ? 'both ends' : by.length === 1 ? nodeName(by[0]) + ' only' : '–'],
      ]));
    }
    if (hb) {
      const data = (PH.link || []).filter((d) => num(d.t)).sort((a, b) => a.t - b.t);
      const t0 = hb.now - hb.range * 1000, bar = h('div', { class: 'timeline', role: 'img', 'aria-label': 'path over the last hour' });
      let cur = null, from = t0;
      const push = (to, p) => { if (to > from) bar.append(h('span', { style: 'flex:' + (to - from) + ';background:' + (p === 'direct' ? 'var(--direct)' : p === 'relay' ? 'var(--relay)' : 'transparent'), title: (p ? pathLabel(p) : 'no link') + ' from ' + clock(from) + ' to ' + clock(to) })); from = to; };
      for (const d of data) {
        const p = d.path || null; const tt = Math.max(t0, d.t);
        if (p !== cur) { push(tt, cur); cur = p; }
      }
      const lastT = data.length ? data[data.length - 1].t + hb.step * 1000 : t0;
      push(Math.min(hb.now, lastT), cur); push(hb.now, null);
      out.push(h('div', { class: 'psec' }, 'Path, last hour'), bar, h('div', { class: 'tlaxis' }, h('span', null, '−60 min'), h('span', null,
        h('span', { class: 'key' }, h('i', { class: 'sq', style: 'background:var(--direct)' }), 'direct'), h('span', { class: 'key' }, h('i', { class: 'sq', style: 'background:var(--relay)' }), 'relayed')), h('span', null, 'now')));
      out.push(miniChart('Round-trip time', Object.assign({}, hb, { data, fmt: (v) => (num(v) ? fmtMs(v) : '–'), series: [{ k: 'rtt_ms', label: 'RTT', color: 'var(--direct)', area: true }] })));
      out.push(miniChart('Traffic', Object.assign({}, hb, { data, fmt: rateFmt, series: [{ k: 'rate', label: 'Both directions', color: 'var(--s3)', area: true }] })));
    } else out.push(h('div', { class: 'psec' }, 'Loading history…'));
  } else if (sel.type === 'relay') {
    const k = normUrl(sel.url);
    const homed = (S.nodes || []).filter((n) => normUrl(n.home_relay) === k);
    const via = (S.links || []).filter((l) => l.path === 'relay' && normUrl(l.relay) === k);
    out.push(h('div', { class: 'ph' }, h('div', null, h('h3', null, relayHost(sel.url)), h('div', { class: 'id' }, sel.url)), close));
    out.push(h('p', { style: 'color:var(--ink-2);font-size:13px' }, 'A public relay: it forwards end-to-end encrypted traffic when nodes cannot reach each other directly.'));
    out.push(h('div', { class: 'psec' }, 'Homed here (' + homed.length + ')'));
    for (const n of homed) out.push(h('div', { class: 'plink', onclick: () => select({ type: 'node', id: n.id }) }, statusDot(n), nodeLabel(n), h('span', { class: 'rt' }, n.home_relay_connected === false ? 'not connected' : 'connected')));
    out.push(h('div', { class: 'psec' }, 'Relayed links (' + via.length + ')'));
    for (const l of via) out.push(h('div', { class: 'plink', onclick: () => select({ type: 'link', a: l.a, b: l.b }) }, nodeName(l.a) + ' ⇄ ' + nodeName(l.b), h('span', { class: 'rt' }, fmtMs(l.rtt_ms) + ' · ' + fmtRate(l.rate))));
  }
  panel.replaceChildren(...out);
  panel.scrollTop = scroll;
}

// ---------- main ----------
function renderAll() {
  renderTiles();
  Net.update(st.state);
  renderTable();
  if (st.sel) renderPanel();
}
function fromHash() {
  const m = /^#(node|link|relay)=(.+)$/.exec(location.hash);
  if (!m) return null;
  const v = decodeURIComponent(m[2]);
  if (m[1] === 'node') return { type: 'node', id: v };
  if (m[1] === 'relay') return { type: 'relay', url: v };
  const [a, b] = v.split(','); return a && b ? { type: 'link', a, b } : null;
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { renderCharts(); if (st.sel) renderPanel(); }, 150); });
const r0 = store.get('gp2p-range'); if ([900, 3600, 21600, 86400, 604800].includes(r0)) st.range = r0;
markRange(); renderTableHead();
const hs = fromHash();
if (hs) { st.sel = hs; st.panelKey = hs.type + ':' + (hs.id || hs.url || hs.a + ',' + hs.b); }
pollState().then(() => { if (st.sel) pollPanel(); });
pollHistory();
})();
</script>
