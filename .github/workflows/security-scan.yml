name: Security scan · Haiku
run-name: Haiku scan · ${{ inputs.scope }} · ${{ github.ref_name }} · @${{ github.actor }}

# Deliberately manual-only: no push, pull_request, or scheduled API spending.
# Budget: one request per area, at most $0.056 per run (all areas, thinking);
# see harness/security-scan.md.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Area to review (all = one request per area)
        type: choice
        options: [all, records, handshake, closed-network, cli-servers]
        default: all
      thinking:
        description: Haiku thinking effort (medium found the known bugs; off is cheapest)
        type: choice
        options: [medium, low, "off"]
        default: medium
      source_ref:
        description: Review the sources of this git revision instead (empty = the selected branch)
        type: string
        default: ""
      publish_pages:
        description: Publish to Pages (requires repository Pages setup)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-scan-haiku
  cancel-in-progress: false

jobs:
  checks:
    name: Deterministic checks
    # No secrets are passed; the results come back as artifacts. The ./
    # form, not $/: actionlint 1.7.12 does not know the newer syntax.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]

  scan:
    name: Scan and render report
    needs: checks
    # Findings of the deterministic checks do not stop the review.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The API key belongs in this environment's secrets, where an admin can
    # limit it to main and add reviewers (docs/security-checks.md).
    environment: security-scan
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SCOPE: ${{ inputs.scope }}
      THINKING: ${{ inputs.thinking }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Prepare report directory
        run: echo "REPORT_DIR=$RUNNER_TEMP/security-scan" >> "$GITHUB_ENV"

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history, for source_ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Collect deterministic check results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-checks-*
          merge-multiple: true
          path: ${{ runner.temp }}/security-checks

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/security-scan-requirements.txt

      - name: Install scanner
        # Every package is pinned with hashes (harness/security-scan-requirements.in).
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary :all: -r harness/security-scan-requirements.txt

      - name: Check scanner and renderer with synthetic data
        run: python -m unittest discover -s harness -p 'test_*security*.py'

      - name: Record scope and budget (no API call)
        id: plan
        run: |
          mkdir -p "$REPORT_DIR"
          cat "$RUNNER_TEMP"/security-checks/*.jsonl > "$REPORT_DIR/checks.jsonl" 2>/dev/null || true
          args=(--scope "$SCOPE" --thinking "$THINKING" --checks "$REPORT_DIR/checks.jsonl")
          [ -z "$SOURCE_REF" ] || args+=(--source-ref "$SOURCE_REF")
          python harness/security_scan.py --dry-run "${args[@]}" > "$REPORT_DIR/scan-plan.json"

      - name: Run the bounded Haiku review
        id: scan
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY_SCX }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret CLAUDE_API_KEY_SCX is missing or unavailable."
            exit 1
          fi
          args=(--scope "$SCOPE" --thinking "$THINKING" --checks "$REPORT_DIR/checks.jsonl")
          [ -z "$SOURCE_REF" ] || args+=(--source-ref "$SOURCE_REF")
          python harness/security_scan.py "${args[@]}" --output "$REPORT_DIR/report.json"

      - name: Render HTML and embedded summary
        id: render
        # Also after a partly failed scan: the report says which areas failed.
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: |
          if [ ! -f "$REPORT_DIR/report.json" ]; then
            echo "::error::The scan wrote no report."
            exit 1
          fi
          python harness/render_security_report.py "$REPORT_DIR/report.json"
          python harness/render_security_report.py "$REPORT_DIR/report.json" --format github

      - name: Upload reports
        id: artifact
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-scan/*
          if-no-files-found: error
          retention-days: 14

      - name: Embed report in Actions summary
        if: ${{ !cancelled() }}
        env:
          REPORT_DIR: ${{ runner.temp }}/security-scan
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["REPORT_DIR"])
          def load(name):
              path = directory / name
              return json.loads(path.read_text()) if path.exists() else {}

          plan = load("scan-plan.json")
          report = load("report.json")
          usage = report.get("usage", {})
          def dollars(value):
              return f"${value:.6f}" if isinstance(value, (int, float)) else "Unavailable"

          rows = [
              ("Scan", os.environ["SCAN_OUTCOME"]),
              ("HTML", os.environ["RENDER_OUTCOME"]),
              ("Model", plan.get("model", "Unavailable")),
              ("Scope", plan.get("scope_name", "Unavailable")),
              ("Thinking", plan.get("thinking", "Unavailable")),
              ("Commit", plan.get("git_head", os.environ["GITHUB_SHA"])),
              ("Source", f'{plan.get("source", "Unavailable")} ({plan.get("source_commit", "")[:12]})'),
              ("Source files", len(plan.get("scope", []))),
              ("Input token limit", plan.get("input_token_limit", "Unavailable")),
              ("Output token limit", plan.get("output_token_limit", "Unavailable")),
              ("Generation request limit", plan.get("generation_request_limit", "Unavailable")),
              ("Retries", "0"),
              ("Input / output tokens", f"{usage.get('input_tokens', '—')} / {usage.get('output_tokens', '—')}"),
              ("Estimated cost", dollars(report.get("estimated_actual_usd"))),
              ("Configured maximum estimate", dollars(plan.get("estimated_max_usd"))),
          ]
          lines = ["## Haiku security scan", "", "| Run detail | Value |", "| --- | --- |"]
          lines += [f"| {label} | {value} |" for label, value in rows]
          if os.environ["ARTIFACT_URL"]:
              lines += ["", f"[Download reports]({os.environ['ARTIFACT_URL']})", "",
                        "Open `report.html` from the downloaded archive. `report.json` contains the structured output; `scan-plan.json` records scope and limits."]
          lines += ["", "Findings are embedded below and do not fail the job. Scanner or rendering failures do fail the job.",
                    "Cost figures use the scanner’s configured rates; they are estimates, not billing guarantees. Missing usage does not imply zero cost."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
              summary = directory / "report.summary.md"
              if summary.exists():
                  output.write("\n" + summary.read_text(encoding="utf-8"))
              else:
                  output.write("\nNo embedded report is available for this run. Check the step status above.\n")
          PY

      - name: Prepare public Pages report
        if: ${{ success() && inputs.publish_pages && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-scan-site"
          cp "$REPORT_DIR/report.html" "$RUNNER_TEMP/security-scan-site/index.html"
          cp "$REPORT_DIR/report.json" "$RUNNER_TEMP/security-scan-site/report.json"
          cp "$REPORT_DIR/scan-plan.json" "$RUNNER_TEMP/security-scan-site/scan-plan.json"

      - name: Upload Pages site
        if: ${{ success() && inputs.publish_pages && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/security-scan-site

  deploy:
    name: Publish report to GitHub Pages
    needs: scan
    if: ${{ inputs.publish_pages && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # deploy the report to GitHub Pages
      id-token: write # OIDC token that actions/deploy-pages requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy latest report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Link published report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## Published security report\n\n[Open HTML report](%s) · [Download JSON](%sreport.json)\n\nThis public site shows the latest successful manual scan on main.\n' "$PAGE_URL" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
