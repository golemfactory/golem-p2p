[workspace]
resolver = "3"
members = ["crates/golem-p2p", "crates/golem-p2p-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/golemfactory/golem-p2p"
publish = false

[workspace.dependencies]
golem-p2p = { path = "crates/golem-p2p" }
# No default features. In particular not `portmapper`: golem-p2p deliberately
# does not map ports on the user's router (UPnP, PCP, NAT-PMP), see
# docs/design.md, section 9. Do not enable it. The endpoint also disables port
# mapping at runtime, in case another crate of a larger build enables the
# feature (Cargo unifies features).
# iroh 1.5.0 is not on crates.io yet: it comes from the golemfactory/iroh fork,
# see [patch.crates-io] below.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "metrics"] }
iroh-relay = { version = "=1.5.0", default-features = false }
anyhow = "1"
axum = { version = "0.8", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sha3 = "0.12"
thiserror = "2"
tokio = { version = "1.44", features = ["rt", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# golemfactory/iroh, branch relay-recovery: upstream main (1.5.0) plus bounded
# relay actor waits and recovery of stalled relay tasks (RELAY_RECOVERY.md in
# the fork). All four crates from the same revision so they stay one identity.
# Back to crates.io once an upstream release contains equivalent fixes.
[patch.crates-io]
iroh = { git = "https://github.com/golemfactory/iroh", rev = "4ad24ac2761e97fe57791d8d898fd608b78ca0d5" }
iroh-base = { git = "https://github.com/golemfactory/iroh", rev = "4ad24ac2761e97fe57791d8d898fd608b78ca0d5" }
iroh-dns = { git = "https://github.com/golemfactory/iroh", rev = "4ad24ac2761e97fe57791d8d898fd608b78ca0d5" }
iroh-relay = { git = "https://github.com/golemfactory/iroh", rev = "4ad24ac2761e97fe57791d8d898fd608b78ca0d5" }
